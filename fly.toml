app = "ct-api-d7c679"
primary_region = "nrt"        # Tokyo — closest to jp-tok watsonx

[build]
  dockerfile = "Dockerfile.api"

[env]
  MILVUS_DB_PATH = "/data/rag_memory.json"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep warm — no cold starts during demo
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "rag_data"
  destination = "/data"
